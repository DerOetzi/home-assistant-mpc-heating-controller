unblock:
  name: Unblock
  description: >-
    Clear a manual-override block for one or more rooms and let automatic
    comfort/eco selection resume.
  target:
    entity:
      integration: heating_controller

recalibrate:
  name: Recalibrate
  description: >-
    Set the learned UA and capacity factors and the observer's disturbance of
    one or more rooms. A value left out stays unchanged; pass 1.0 to reset a
    factor, 0 to reset the disturbance. Admin only.
  target:
    entity:
      integration: heating_controller
  fields:
    ua_factor:
      name: UA factor
      description: Learned heat-loss factor. 1.0 resets it to the design heat load.
      example: 1.0
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.001
          mode: box
    capacity_factor:
      name: Capacity factor
      description: Learned thermal-capacity factor. 1.0 resets it to the design value.
      example: 1.0
      selector:
        number:
          min: 0.5
          max: 3.0
          step: 0.001
          mode: box
    disturbance_w:
      name: Disturbance
      description: >-
        Lasting heat the model does not explain, in watts. 0 resets it; the
        room limits it to its heat load in either direction.
      example: 0
      selector:
        number:
          min: -10000
          max: 10000
          step: 1
          unit_of_measurement: W
          mode: box
