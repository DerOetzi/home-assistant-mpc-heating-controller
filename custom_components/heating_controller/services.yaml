unblock:
  name: Unblock
  description: >-
    Clear a manual-override block for one or more rooms and let automatic
    comfort/eco selection resume.
  target:
    entity:
      integration: heating_controller

recalibrate:
  name: Recalibrate
  description: >-
    Set the learned UA and capacity factors or the setpoint correction of one
    or more rooms, or reset their learned gains. A value left out stays
    unchanged; pass 1.0 to reset a factor. Admin only.
  target:
    entity:
      integration: heating_controller
  fields:
    ua_factor:
      name: UA factor
      description: Learned heat-loss factor. 1.0 resets it to the design heat load.
      example: 1.0
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.001
          mode: box
    capacity_factor:
      name: Capacity factor
      description: >-
        Learned thermal-capacity factor. 1.0 resets it to the design value.
        The airing capacity starts afresh from it.
      example: 1.0
      selector:
        number:
          min: 0.15
          max: 3.0
          step: 0.001
          mode: box
    reset_gains:
      name: Reset gains
      description: >-
        Forget the learned steady gain, gain profile and sun terms of the
        room and learn them anew.
      example: true
      selector:
        boolean:
    setpoint_correction:
      name: Setpoint correction
      description: >-
        Correction added to the mode's setpoint handed to the TRVs, in K. The
        automatic correction carries on from it after two hours.
      example: 1.0
      selector:
        number:
          min: -3.0
          max: 3.0
          step: 0.5
          unit_of_measurement: K
          mode: box
