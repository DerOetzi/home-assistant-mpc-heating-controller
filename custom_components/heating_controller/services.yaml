unblock:
  name: Unblock
  description: >-
    Clear a manual-override block for one or more rooms and let automatic
    comfort/eco selection resume.
  target:
    entity:
      integration: heating_controller

recalibrate:
  name: Recalibrate
  description: >-
    Set the learned UA and capacity factors of one or more rooms, or reset
    their learned gains or valve curves. A factor left out stays unchanged;
    pass 1.0 to reset it. Admin only.
  target:
    entity:
      integration: heating_controller
  fields:
    ua_factor:
      name: UA factor
      description: Learned heat-loss factor. 1.0 resets it to the design heat load.
      example: 1.0
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.001
          mode: box
    capacity_factor:
      name: Capacity factor
      description: Learned thermal-capacity factor. 1.0 resets it to the design value.
      example: 1.0
      selector:
        number:
          min: 0.5
          max: 3.0
          step: 0.001
          mode: box
    reset_gains:
      name: Reset gains
      description: >-
        Forget the learned steady gain, gain profile and sun terms of the
        room and learn them anew.
      example: true
      selector:
        boolean:
    reset_valve_curves:
      name: Reset valve curves
      description: >-
        Forget the samples of the valve curve each TRV of the room learned
        (setpoint offset to opening); the profile's starting value applies
        until new samples come in.
      example: true
      selector:
        boolean:
